name: Build aarch64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run :core tests (pure Kotlin, no pjsip/Docker needed)
        working-directory: ha-sip
        run: ./gradlew :core:test --no-daemon --console=plain

  build-aarch64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read BUILD_FROM base image + add-on version
        id: manifest
        working-directory: ha-sip
        run: |
          echo "build_from=$(jq -r '.build_from.aarch64' build.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' config.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: agellhaus
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: ha-sip
          file: ha-sip/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_FROM=${{ steps.manifest.outputs.build_from }}
          tags: |
            agellhaus/aarch64-ha-sip-kt:${{ steps.manifest.outputs.version }}
            agellhaus/aarch64-ha-sip-kt:latest
